timezone: America/Chicago
paths:
  static: public
  uploads: public/images/counsel
collections_config:
  data:
    path: data
    glob:
      - counsel-content.json
    name: Website Content
    icon: article
    disable_url: true
    disable_add: true
    disable_add_folder: true
    _enabled_editors:
      - data
collection_groups:
  - heading: Counsel Concierge Nursing
    collections:
      - data
_inputs:
  pages:
    type: array
    comment: Public pages and Insights articles. Keep existing paths to preserve incoming links.
    options:
      preview:
        text:
          - key: title
        subtext:
          - key: path
  path:
    type: text
    comment: Website path beginning with /. New articles use /insights/your-article-title.
  title:
    type: text
  description:
    type: textarea
    comment: Search engine description.
  date:
    type: datetime
  author:
    type: text
  category:
    type: text
    comment: Short topic label for Insights articles.
  image:
    type: image
  excerpt:
    type: textarea
    comment: Summary shown on the Insights index.
  blocks:
    type: array
    comment: Existing pages have carefully arranged sections. Edit the writing within blocks without changing their order. Articles can use one HTML block for the full body.
    options:
      preview:
        text:
          - key: type
  html:
    type: html
    options:
      bold: true
      italic: true
      link: true
      bulletedlist: true
      numberedlist: true
      format: p h2 h3 h4
  type:
    type: text
    hidden: true
  text:
    hidden: true
  form:
    type: object
    comment: Existing hosted form destination. Keep this until a replacement submission service is configured.
  fields:
    hidden: true
